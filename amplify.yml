version: 1
backend:
  phases:
    preBuild:
      commands:
        - npm i -g @aws-amplify/cli@14
        # ensure enough history to find the previous deployed commit
        - git fetch --no-tags --prune origin $AWS_BRANCH --depth=1000 || true
    build:
      commands:
        - set -euo pipefail

        # --- Resolve Amplify App ID (from env var or team-provider-info.json) ---
        - |
          if [ -n "${APP_ID:-}" ]; then
            AMPLIFY_APP_ID="$APP_ID"
          else
            # fallback: parse from amplify/team-provider-info.json (Gen 1 projects)
            AMPLIFY_APP_ID=$(awk -F'"' '/AmplifyAppId/ {print $4; exit}' amplify/team-provider-info.json || true)
          fi
          echo "Amplify AppId: ${AMPLIFY_APP_ID}"

        # --- Find the previous successful deploy commit on this branch ---
        - |
          CURR_COMMIT="${AWS_COMMIT_ID:-$(git rev-parse HEAD)}"
          echo "Current commit: $CURR_COMMIT"

          PREV_DEPLOY_COMMIT=$(
            aws amplify list-jobs \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AWS_BRANCH" \
              --max-items 50 \
              --query "jobSummaries[?status=='SUCCEED' && commitId!='${CURR_COMMIT}']|[0].commitId" \
              --output text 2>/dev/null || true
          )
          if [ -z "$PREV_DEPLOY_COMMIT" ] || [ "$PREV_DEPLOY_COMMIT" = "None" ]; then
            # first deploy or no prior success found: fall back to previous commit
            PREV_DEPLOY_COMMIT=$(git rev-parse HEAD^ || git rev-list --max-parents=0 HEAD)
          fi
          echo "Previous deployed commit: $PREV_DEPLOY_COMMIT"

          # make sure we have that commit locally (shallow clones may miss it)
          git cat-file -e "$PREV_DEPLOY_COMMIT^{commit}" || git fetch origin "$PREV_DEPLOY_COMMIT" --depth=1

        # --- Compute changed backend files since last deployment ---
        - |
          git diff --name-only "$PREV_DEPLOY_COMMIT" "$CURR_COMMIT" > /tmp/changed.txt || true
          echo "Changed files since last deployment:" && cat /tmp/changed.txt || true

        # If no backend paths changed, skip pushing
        - |
          if ! grep -q '^amplify/backend/' /tmp/changed.txt; then
            echo "No backend changes since last deployment. Skipping push."
            exit 0
          fi

        # Choose the narrowest push command
        - |
          PUSH_CMD="amplify push --yes"
          if grep -q '^amplify/backend/function/' /tmp/changed.txt; then
            PUSH_CMD="amplify function push --yes"
          elif grep -Eq '^amplify/backend/api/|^graphql/|schema\.graphql$' /tmp/changed.txt; then
            PUSH_CMD="amplify api push --yes"
          fi
          echo "Selected deploy command: $PUSH_CMD"
          $PUSH_CMD
