version: 1

# --- Minimal stub so Amplify Hosting doesn't complain about missing frontend ---
frontend:
  phases:
    preBuild:
      commands:
        - 'echo "Backend-focused branch: skipping real frontend build"'
    build:
      commands:
        - mkdir -p dist
        - 'echo "<!doctype html><title>Backend-only</title><h1>Backend-only branch</h1>" > dist/index.html'
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# --- Backend: headless pull + dynamic commit-aware deploy (function/api/full) ---
backend:
  phases:
    preBuild:
      commands:
        # Ensure enough history for diffs (esp. shallow clones)
        - "git fetch --no-tags --prune origin \"$AWS_BRANCH\" --deepen=1000 || true"

    build:
      commands:
        # Write the whole backend logic into a script to avoid YAML quoting issues
        - |
          cat > run-backend.sh <<'SCRIPT'
          set -euo pipefail

          # --- Resolve Amplify App ID (prefer APP_ID env; fallback to team-provider-info.json) ---
          if [ -n "${APP_ID:-}" ]; then
            AMPLIFY_APP_ID="$APP_ID"
          else
            AMPLIFY_APP_ID=$(awk -F'"' '/AmplifyAppId/ {print $4; exit}' amplify/team-provider-info.json 2>/dev/null || true)
          fi
          echo "Amplify AppId: ${AMPLIFY_APP_ID}"

          # --- Resolve backend environment name ---
          # 1) Use AMPLIFY_ENV if you set it in Console env vars; otherwise
          # 2) take the first key in team-provider-info.json; otherwise dev
          if [ -n "${AMPLIFY_ENV:-}" ]; then
            ENV_NAME="$AMPLIFY_ENV"
          elif [ -f amplify/team-provider-info.json ]; then
            ENV_NAME=$(node -e "console.log(Object.keys(require('./amplify/team-provider-info.json'))[0]||'')" 2>/dev/null || true)
            ENV_NAME="${ENV_NAME:-dev}"
          else
            ENV_NAME="dev"
          fi
          echo "Amplify env: ${ENV_NAME}"

          # --- Ensure full history if the repo is shallow ---
          if git rev-parse --is-shallow-repository >/dev/null 2>&1 && git rev-parse --is-shallow-repository | grep -q true; then
            git fetch --unshallow --no-tags --prune origin "$AWS_BRANCH" || true
          fi

          # --- Headless pull to hydrate local amplify/ state (creates amplify-meta.json & local-env-info) ---
          # This avoids the "local-env-info.json / amplify-meta.json does not exist" errors during category pushes.
          # Headless flags documented in Amplify CLI "Headless mode" docs.
          amplify pull \
            --yes \
            --appId "$AMPLIFY_APP_ID" \
            --envName "$ENV_NAME" \
            --amplify "{\"appId\":\"$AMPLIFY_APP_ID\",\"envName\":\"$ENV_NAME\"}" \
            --providers "{\"awscloudformation\":{\"configLevel\":\"project\",\"useProfile\":false,\"region\":\"${AWS_REGION:-us-east-1}\"}}" \
            --frontend "{\"frontend\":\"javascript\",\"framework\":\"none\",\"config\":{}}" 
          
          # --- Current commit from Amplify env (fallback to git) ---
          CURR_COMMIT="${AWS_COMMIT_ID:-$(git rev-parse HEAD)}"
          echo "Current commit: $CURR_COMMIT"

          # --- Find the most recent SUCCEED job's commit on this branch (exclude current) ---
          PREV_DEPLOY_COMMIT=$(
            aws amplify list-jobs \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AWS_BRANCH" \
              --no-paginate \
              --query "reverse(sort_by(jobSummaries[?status=='SUCCEED' && commitId!='\`$CURR_COMMIT\`'], &startTime))[0].commitId" \
              --output text 2>/dev/null \
            | tr -d '\r' \
            | grep -E '^[0-9a-f]{7,}$' \
            | head -n1
          )

          # Fallbacks if nothing came back (first deploy or no prior success)
          if [ -z "$PREV_DEPLOY_COMMIT" ]; then
            PREV_DEPLOY_COMMIT=$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          fi
          echo "Previous deployed commit: $PREV_DEPLOY_COMMIT"

          # Make sure we have that commit locally
          git cat-file -e "$PREV_DEPLOY_COMMIT^{commit}" 2>/dev/null || \
            git fetch origin "$AWS_BRANCH" --deepen=1000

          # --- Compute changes since the previous successful deployment ---
          git diff --name-only "$PREV_DEPLOY_COMMIT" "$CURR_COMMIT" > /tmp/changed.txt || true
          echo "Changed files since last deployment:"
          cat /tmp/changed.txt || true

          # --- If no backend paths changed, skip pushing altogether ---
          if ! grep -q '^amplify/backend/' /tmp/changed.txt; then
            echo "No backend changes since last deployment. Skipping amplify push."
            exit 0
          fi

          # --- Choose the narrowest push command (function vs api vs full) ---
          FUNCTION_CHANGED=0
          API_CHANGED=0
          grep -q '^amplify/backend/function/' /tmp/changed.txt && FUNCTION_CHANGED=1
          grep -Eq '^amplify/backend/api/|^graphql/|schema\.graphql$' /tmp/changed.txt && API_CHANGED=1

          if [ "$FUNCTION_CHANGED" -eq 1 ] && [ "$API_CHANGED" -eq 1 ]; then
            PUSH_CMD="amplify push --yes"
          elif [ "$FUNCTION_CHANGED" -eq 1 ]; then
            PUSH_CMD="amplify function push --yes"
          elif [ "$API_CHANGED" -eq 1 ]; then
            PUSH_CMD="amplify api push --yes"
          else
            PUSH_CMD="amplify push --yes"
          fi

          echo "Selected deploy command: $PUSH_CMD"
          $PUSH_CMD
          SCRIPT
        - chmod +x run-backend.sh
        - ./run-backend.sh

  cache:
    paths:
      - ~/.npm/**/*
      - node_modules/**/*
